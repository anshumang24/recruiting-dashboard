name: Check job portals

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC; these land ~2am/8am/2pm/8pm ET.
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      debug:
        description: 'Print diagnostic detail for each target (for troubleshooting)'
        type: boolean
        default: false

permissions:
  contents: write           # to commit live_jobs.json
  issues: write             # to open an issue when new postings appear

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        id: scrape
        env:
          SCRAPER_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: python scraper/scrape.py

      - name: Commit results
        run: |
          git config user.name  "job-scraper"
          git config user.email "actions@github.com"
          git add live_jobs.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Portal check: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Opening an issue emails you automatically (GitHub notifies repo owners
      # on new issues by default). No SMTP credentials needed.
      - name: Alert on new postings
        if: steps.scrape.outputs.new_count != '0' && steps.scrape.outputs.new_count != ''
        uses: actions/github-script@v7
        with:
          script: |
            const n = '${{ steps.scrape.outputs.new_count }}';
            const body = `${{ steps.scrape.outputs.summary }}

            ---
            Found by the automated portal check. Verify on the company's own site before relying on it — and update \`verified\` in \`firms.json\` once you've confirmed.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${n} new posting${n === '1' ? '' : 's'} — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['new-posting']
            });
